name: Security updates

on:
  schedule:
    # Off the top of the hour: GitHub delays scheduled runs at peak times.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: security-updates

jobs:
  update:
    uses: IQ2i/.github/.github/workflows/security-updates.yml@main
    with:
      php-extensions: intl, pdo_sqlite, zip, pcntl
      assignee: loicsapone

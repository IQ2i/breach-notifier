name: Update dependencies

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: update-dependencies

jobs:
  update:
    uses: IQ2i/.github/.github/workflows/dependency-update.yml@main
    with:
      mode: nightly
      php-version: '8.5'
      php-extensions: intl, pdo_sqlite, zip, pcntl

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PHP_VERSION: '8.4'

jobs:
  composer-validate:
    name: Validate composer.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          php-version: ${{ env.PHP_VERSION }}
      - run: composer validate --strict

  lint:
    name: Lint config, twig and container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          php-version: ${{ env.PHP_VERSION }}
      - run: composer lint

  cs-check:
    name: Coding standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          php-version: ${{ env.PHP_VERSION }}
      - run: composer cs-check

  phpstan:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          php-version: ${{ env.PHP_VERSION }}
      - run: composer phpstan

  test:
    name: Test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          php-version: ${{ env.PHP_VERSION }}
      - run: composer test

version: 2

updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Europe/Paris
    versioning-strategy: increase
    assignees:
      - loicsapone
    commit-message:
      prefix: chore
    # The first matching group wins: security fixes (opened right away, outside of the schedule) are never
    # held back by a major, and only the "dependencies" group is merged automatically.
    # Dependabot only knows the advisories reviewed by GitHub, which come days or weeks after Symfony publishes them:
    # security-updates.yml audits the lock files every hour to cover that delay.
    groups:
      security:
        applies-to: security-updates
        patterns: ['*']
      major:
        applies-to: version-updates
        patterns: ['*']
        update-types: [major]
      dependencies:
        applies-to: version-updates
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # Symfony minors go through extra.symfony.require and the Flex recipes, which Dependabot ignores.
      # Raise this bound each time the project moves to a new Symfony minor.
      - dependency-name: 'symfony/*'
        versions: ['>= 8.2']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    assignees:
      - loicsapone
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
